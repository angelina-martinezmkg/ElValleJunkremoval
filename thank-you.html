<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank You | Jays Junk Removal</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/logo-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .thanks { min-height: 100vh; display: grid; place-items: center; padding: 3rem 16px; background: var(--gray); }
    .thanks .form-card { max-width: 560px; width: 100%; text-align: center; }
    .thanks img { width: 96px; height: 96px; margin: 0 auto 1rem; object-fit: contain; }
    .thanks h1 { font-size: clamp(2rem, 6vw, 2.8rem); font-weight: 800; margin-bottom: .8rem; }
    .thanks p { color: var(--muted); }
    .thanks .btns { display: grid; gap: .7rem; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <main class="thanks">
    <div class="form-card form-card--accent">
      <img src="assets/logo-512.png" alt="Jays Junk Removal logo" width="96" height="96">
      <h1>Thank you! <span class="text-red">We got it.</span></h1>
      <p>Your request was sent to Jays Junk Removal. We’ll follow up as soon as possible to confirm the details.</p>
      <div class="btns">
        <a href="/" class="btn btn--red btn--block">Back to Home</a>
        <a href="tel:5717070586" class="btn btn--outline btn--block">Call (571) 707-0586</a>
      </div>
    </div>
  </main>
</body>
</html>
